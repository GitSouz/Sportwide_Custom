# Flyway configuration for the Sportwide Azure SQL database.
#
# This file holds NON-SECRET settings only. Provide credentials and the
# connection URL via environment variables (recommended) or a local override
# file that is git-ignored (db/flyway.local.conf) — never commit secrets.
#
# Flyway reads FLYWAY_* environment variables automatically, so you can set:
#   FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD
# and leave the values below empty.
#
# Example Azure SQL JDBC URL (set via FLYWAY_URL):
#   jdbc:sqlserver://<server-name>.database.windows.net:1433;\
#     database=<database-name>;encrypt=true;trustServerCertificate=false;\
#     hostNameInCertificate=*.database.windows.net;loginTimeout=30

# Locations of migration scripts (relative to this file / the working dir).
flyway.locations=filesystem:./migrations

# Only touch objects we manage; keep Flyway's history table in dbo.
flyway.schemas=dbo
flyway.defaultSchema=dbo

# Safety: fail if a previously-applied migration file has been changed.
flyway.validateOnMigrate=true

# Do NOT auto-clean in shared environments. Leave disabled.
flyway.cleanDisabled=true

# Connection settings are intentionally left blank here.
# Set them via FLYWAY_URL / FLYWAY_USER / FLYWAY_PASSWORD env vars,
# or uncomment and fill a git-ignored db/flyway.local.conf.
# flyway.url=
# flyway.user=
# flyway.password=
